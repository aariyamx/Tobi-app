name: Build Tobi APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev libltdl-dev automake

      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Cache Buildozer downloads (SDK/NDK)
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show error summary
        if: failure()
        run: |
          echo "=== 90 lines before the last STDERR block (where the real error usually is) ==="
          n=$(grep -n "STDERR:" build.log | tail -1 | cut -d: -f1)
          if [ -n "$n" ]; then
            start=$((n-90)); [ "$start" -lt 1 ] && start=1
            sed -n "${start},${n}p" build.log | sed 's/\x1b\[[0-9;]*m//g'
          else
            echo "No STDERR block found. Last 80 lines of the log:"
            tail -80 build.log | sed 's/\x1b\[[0-9;]*m//g'
          fi
          echo
          echo "=== Lines containing error or failed ==="
          grep -n -i -E "error|failed|fatal|traceback" build.log | grep -v -E "ENVIRONMENT|GITHUB_|#     " | sed 's/\x1b\[[0-9;]*m//g' | tail -40

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tobi-apk
          path: bin/*.apk
